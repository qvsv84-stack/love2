<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lịch Hội Trường</title>
<style>
:root{--bg:#f5f7fa;--sf:#fff;--fg:#15202b;--mu:#5b6876;--ln:#d9e0e8;--ac:#1f4e79;--acf:#fff;--bad:#b3261e;--ok:#1b7a43}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--sf:#18212b;--fg:#e8eef4;--mu:#9aa8b6;--ln:#2b3745;--ac:#7fb2e0;--acf:#0b1620;--bad:#ff8a80;--ok:#5fcf8a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0}.sub{color:var(--mu);margin:4px 0 0;font-size:.9rem}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0}
input[type=date],input[type=text]{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%;box-sizing:border-box;min-width:0}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acf);padding:11px 16px}
button.alt{background:transparent;color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.hint{font-size:.85rem;color:var(--mu);margin:0}
.st{font-size:.9rem;min-height:1.3em}.err{color:var(--bad)}.ok{color:var(--ok)}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shifts label{font-size:.8rem;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.shifts input{padding:8px;font-size:15px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln);font-size:1.05rem}
.opt input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.opt .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--mu)}
#out{display:flex;flex-direction:column;gap:10px}
#out img{width:100%;border:1px solid var(--ln);border-radius:6px;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Lịch Hội Trường</h1><p class="sub">HT Tổng hợp và HT Nhân văn. Dữ liệu lấy mới từ web trường mỗi lần mở.</p></header>
<section>
  <h2>Ngày</h2>
  <input type="date" id="day" aria-label="Chọn ngày">
  <div class="row"><button id="reload" class="alt" type="button">Tải lại dữ liệu</button></div>
  <div id="msg" class="st" role="status">Đang tải dữ liệu...</div>
  <div class="shifts">
    <label>Giờ ca 1<input type="text" id="s1" placeholder="vd 7:00-11:30"></label>
    <label>Giờ ca 2<input type="text" id="s2" placeholder="vd 13:00-17:00"></label>
    <label>Giờ ca 3<input type="text" id="s3" placeholder="vd 18:00-21:00"></label>
  </div>
</section>
<section id="pick" hidden>
  <h2>Chọn trạng thái</h2>
  <div id="opts"></div>
  <div class="row"><button id="make" type="button">Tạo ảnh</button></div>
</section>
<section id="outwrap" hidden><h2>Ảnh</h2><div id="out"></div></section>
</main>
<script>
(function(){
var HALL={'ht-tong-hop':'HT Tổng hợp','ht-nhan-van':'HT Nhân văn'};
var STL={FREE:'Còn trống',CONFIRMED:'Đã duyệt',PENDING:'Chờ duyệt',NEEDS_INFO:'Yêu cầu bổ sung'};
var STC={FREE:'#5b6876',CONFIRMED:'#1b7a43',PENDING:'#a15c00',NEEDS_INFO:'#b3261e'};
var DATA=[],G={},CUR='',BLOB=null;
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fmt(d){return d.split('-').reverse().join('/')}
function msg(t,c){var m=$('msg');m.textContent=t;m.className='st '+(c||'')}
$('day').value=new Date(Date.now()+25200000).toISOString().slice(0,10);
['s1','s2','s3'].forEach(function(id){var v=ls('hs_'+id);if(v)$(id).value=v;$(id).addEventListener('input',function(){ls('hs_'+id,$(id).value)})});
function load(){
  msg('Đang tải dữ liệu...');
  fetch('/api/bookings?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('Máy chủ trường trả lỗi '+r.status);return r.json();
  }).then(function(j){
    var arr=Array.isArray(j)?j:j.data;if(!Array.isArray(arr))throw new Error('Dữ liệu không đúng dạng.');
    DATA=arr.filter(function(x){return HALL[x.hall]});
    msg('Đã cập nhật lúc '+new Date().toLocaleTimeString('vi-VN')+' ('+DATA.length+' đơn của 2 hội trường).','ok');
    build();
  }).catch(function(e){msg('Không tải được: '+e.message,'err')});
}
$('reload').onclick=load;
$('day').addEventListener('change',function(){if(DATA.length)build()});
function build(){
  var d=$('day').value;CUR=d;if(!d)return;
  var keep={};[].slice.call($('opts').querySelectorAll('input')).forEach(function(i){keep[i.value]=i.checked});
  var hadKeep=Object.keys(keep).length>0;
  var D=DATA.filter(function(x){return String(x.usageDate).slice(0,10)==d});
  var ss=['ca-1','ca-2','ca-3'];DATA.forEach(function(x){if(ss.indexOf(x.shift)<0)ss.push(x.shift)});
  G={FREE:[]};
  D.forEach(function(x){var k=x.status||'(không có)';(G[k]=G[k]||[]).push({hall:x.hall,shift:x.shift,st:k,note:[x.organization,x.purpose].filter(Boolean).join(' - ')})});
  Object.keys(HALL).forEach(function(h){ss.forEach(function(s){if(!D.some(function(x){return x.hall==h&&x.shift==s}))G.FREE.push({hall:h,shift:s,st:'FREE',note:''})})});
  var ks=['FREE','CONFIRMED','PENDING','NEEDS_INFO'];Object.keys(G).forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)});
  var o=$('opts');o.innerHTML='';
  ks.forEach(function(k){
    var l=document.createElement('label');l.className='opt';
    var c=document.createElement('input');c.type='checkbox';c.value=k;c.checked=hadKeep?!!keep[k]:(k==='CONFIRMED');
    var s=document.createElement('span');s.textContent=STL[k]||('Mã lạ: '+k);
    var n=document.createElement('span');n.className='n';n.textContent=G[k]?G[k].length:0;
    l.appendChild(c);l.appendChild(s);l.appendChild(n);o.appendChild(l);
  });
  $('pick').hidden=false;
}
function shiftLabel(c){var m=/^ca-(\d+)$/.exec(c);if(!m)return c;var t=($('s'+m[1])||{}).value;return 'Ca '+m[1]+(t&&t.trim()?' ('+t.trim()+')':'')}
$('make').onclick=function(){
  if(!CUR)return;
  var sel=[].slice.call($('opts').querySelectorAll('input')).filter(function(i){return i.checked}).map(function(i){return i.value});
  if(!sel.length){msg('Chưa chọn trạng thái nào.','err');return}
  var rows=[];sel.forEach(function(k){rows=rows.concat(G[k]||[])});
  if(!rows.length){msg('Các mục đã chọn đều có 0 dòng.','err');return}
  rows.sort(function(a,b){return a.hall<b.hall?-1:a.hall>b.hall?1:a.shift<b.shift?-1:a.shift>b.shift?1:0});
  draw(rows,sel);
};
function draw(rows,sel){
  var W=1200,P=30,LH=28,CW=[210,230,190,W-2*P-630];
  var F='-apple-system,"Helvetica Neue",Arial,sans-serif';
  var c=document.createElement('canvas'),x=c.getContext('2d');
  function wrap(t,w){var o=[],l='';String(t||'').split(/\s+/).forEach(function(wd){var m=l?l+' '+wd:wd;if(x.measureText(m).width>w&&l){o.push(l);l=wd}else l=m});if(l)o.push(l);return o.length?o:['']}
  x.font='20px '+F;
  var fl=wrap('Hiển thị: '+sel.map(function(k){return STL[k]||k}).join(', ')+' ('+rows.length+' dòng)',W-2*P);
  x.font='22px '+F;
  rows.forEach(function(r){
    r.L=[wrap(HALL[r.hall],CW[0]-20),wrap(shiftLabel(r.shift),CW[1]-20),wrap(STL[r.st]||r.st,CW[2]-20),wrap(r.note,CW[3]-20)];
    r.H=Math.max.apply(null,r.L.map(function(a){return a.length}))*LH+16;
  });
  var top=P+36+40+fl.length*26+20;
  var H=top+44+rows.reduce(function(s,r){return s+r.H},0)+P;
  c.width=W;c.height=H;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#15202b';x.font='bold 36px '+F;x.fillText('LỊCH ĐĂNG KÝ HỘI TRƯỜNG',P,P+36);
  x.font='26px '+F;x.fillText('Ngày '+fmt(CUR),P,P+76);
  x.font='20px '+F;x.fillStyle='#5b6876';fl.forEach(function(l,i){x.fillText(l,P,P+76+26*(i+1))});
  var y=top;
  x.fillStyle='#1f4e79';x.fillRect(P,y,W-2*P,44);
  x.fillStyle='#fff';x.font='bold 22px '+F;
  var cx=P;['Hội trường','Giờ','Trạng thái','Đơn vị / Ghi chú'].forEach(function(t,i){x.fillText(t,cx+10,y+30);cx+=CW[i]});
  y+=44;
  rows.forEach(function(r,n){
    x.fillStyle=(n&1)?'#eef3f9':'#fff';x.fillRect(P,y,W-2*P,r.H);
    var cx=P;
    r.L.forEach(function(a,i){
      x.fillStyle=(i==2)?(STC[r.st]||'#15202b'):'#15202b';
      x.font=(i==2?'bold ':'')+'22px '+F;
      a.forEach(function(t,j){x.fillText(t,cx+10,y+8+LH*(j+1)-6)});
      cx+=CW[i];
    });
    x.strokeStyle='#d9e0e8';x.beginPath();x.moveTo(P,y+r.H);x.lineTo(W-P,y+r.H);x.stroke();
    y+=r.H;
  });
  var out=$('out');out.innerHTML='';
  var row=document.createElement('div');row.className='row';
  var sb=document.createElement('button');sb.type='button';sb.textContent='Lưu / Chia sẻ';
  row.appendChild(sb);out.appendChild(row);
  var st=document.createElement('div');st.className='st';out.appendChild(st);
  var hint=document.createElement('p');hint.className='hint';hint.textContent='Hoặc nhấn giữ vào ảnh rồi chọn Lưu vào Ảnh.';out.appendChild(hint);
  var im=document.createElement('img');im.alt='Ảnh lịch hội trường';im.src=c.toDataURL('image/png');out.appendChild(im);
  BLOB=null;c.toBlob(function(b){BLOB=b});
  sb.onclick=function(){
    if(!BLOB){st.textContent='Ảnh chưa sẵn sàng, bấm lại sau 1 giây.';st.className='st err';return}
    var f=new File([BLOB],'lich-hoi-truong-'+CUR+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Lịch hội trường '+fmt(CUR)}).catch(function(){})}
    else{st.textContent='Máy không hỗ trợ chia sẻ. Hãy nhấn giữ vào ảnh để lưu.';st.className='st err'}
  };
  $('outwrap').hidden=false;$('outwrap').scrollIntoView({behavior:'smooth'});
}
load();
})();
</script>
</body>
</html>
