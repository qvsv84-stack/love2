<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thiết Lập Khu Vực</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="toast" class="toast">Thành công!</div>

    <!-- Header -->
    <header class="app-header">
        <h1 id="header-title">Tòa Nhà B1</h1>
        <p id="header-subtitle">Nhấn giữ vào Khu vực để thêm giờ làm việc</p>
    </header>

    <!-- Danh sách Khu vực -->
    <main id="area-list" class="area-list">
        <div class="loading-spinner">Đang tải...</div>
    </main>

    <!-- Bottom Navigation (5 Tòa nhà) -->
    <nav class="bottom-nav">
        <button class="nav-building active" data-index="1" onclick="switchBuilding(1)">B1</button>
        <button class="nav-building" data-index="2" onclick="switchBuilding(2)">B2</button>
        <button class="nav-building" data-index="3" onclick="switchBuilding(3)">B3</button>
        <button class="nav-building" data-index="4" onclick="switchBuilding(4)">B4</button>
        <button class="nav-building" data-index="5" onclick="switchBuilding(5)">B5</button>
    </nav>

    <!-- Nút Thêm Khu Vực (+) -->
    <button id="fab-add" class="fab" onclick="openAddAreaModal()">+</button>

    <!-- ================= MODAL: THÊM KHU VỰC ================= -->
    <div id="modal-area" class="modal-overlay" onclick="closeModal('modal-area')">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2>Thêm Khu Vực Mới</h2>
                <button class="close-btn" onclick="closeModal('modal-area')">✕</button>
            </div>
            <form id="form-area" class="sheet-form">
                <input type="text" id="area-name" placeholder="Tên khu vực (VD: Sảnh, Sân sau...)" required>
                <select id="area-type" required class="form-select">
                    <option value="INDOOR">🏢 Trong nhà (Sảnh, Phòng...)</option>
                    <option value="OUTDOOR">🌳 Ngoài trời (Sân, Ngoại cảnh...)</option>
                </select>
                <button type="submit" class="btn-primary">Tạo Khu Vực</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: THÊM GIỜ LÀM VIỆC ================= -->
    <div id="modal-schedule" class="modal-overlay" onclick="closeModal('modal-schedule')">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2 id="schedule-area-title">Thêm Giờ Làm Việc</h2>
                <button class="close-btn" onclick="closeModal('modal-schedule')">✕</button>
            </div>
            
            <div id="schedule-rows">
                <!-- Các dòng nhập giờ sẽ được JS tạo ở đây -->
            </div>

            <div class="sheet-actions">
                <button type="button" class="btn-outline" onclick="addScheduleRow()">+ Thêm dòng</button>
                <button type="button" class="btn-primary" onclick="saveSchedules()">Lưu Tất Cả</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
