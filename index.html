<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giám Sát Vệ Sinh</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="toast" class="toast">Thành công!</div>

    <!-- ================= TRANG GIÁM SÁT ================= -->
    <div id="page-view" class="page active">
        <header class="app-header">
            <div>
                <h1>Giám Sát Hôm Nay</h1>
                <p id="current-date">...</p>
            </div>
        </header>
        <main id="task-list" class="task-list">
            <div class="loading-spinner">Đang tải dữ liệu...</div>
        </main>
    </div>

    <!-- ================= TRANG QUẢN TRỊ ================= -->
    <div id="page-admin" class="page">
        <header class="app-header">
            <h1>Quản Trị Hệ Thống</h1>
            <div class="segment-control">
                <button class="active" onclick="switchAdminTab('schedule')">Lịch Trình</button>
                <button onclick="switchAdminTab('category')">Danh Mục</button>
            </div>
        </header>

        <!-- Sub-tab 1: Quản lý Lịch trình -->
        <div id="admin-tab-schedule" class="admin-content active">
            <div id="admin-schedule-list" class="list-container"></div>
        </div>

        <!-- Sub-tab 2: Quản lý Danh mục (Nhà, Khu vực, Công việc) -->
        <div id="admin-tab-category" class="admin-content">
            <div class="category-section">
                <h3>🏢 Tòa Nhà</h3>
                <div id="list-buildings"></div>
            </div>
            <div class="category-section">
                <h3>📍 Khu Vực</h3>
                <div id="list-areas"></div>
            </div>
            <div class="category-section">
                <h3>📝 Công Việc Mẫu</h3>
                <div id="list-tasks"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button id="btn-view" class="active" onclick="switchMainTab('view')">
            <span class="icon">📋</span> Giám Sát
        </button>
        <button id="btn-admin" onclick="switchMainTab('admin')">
            <span class="icon">⚙️</span> Quản Trị
        </button>
    </nav>

    <!-- Nút Thêm Mới (Floating Action Button) -->
    <button id="fab-add" class="fab" onclick="openModal()">+</button>

    <!-- ================= MODAL (BOTTOM SHEET) ĐỂ THÊM/SỬA ================= -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2 id="modal-title">Thêm Mới</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            
            <form id="dynamic-form" class="sheet-form">
                <!-- Nội dung form sẽ được JS tạo động tùy theo ngữ cảnh -->
                <div id="form-fields"></div>
                <button type="submit" class="btn-primary" id="btn-save">Lưu Lại</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
