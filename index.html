<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giám Sát Vệ Sinh</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Vùng chứa thông báo (Toast) -->
    <div id="toast" class="toast">Đã lưu thành công!</div>

    <!-- Màn hình 1: Xem Lịch Trình -->
    <div id="page-view" class="page active">
        <header class="app-header">
            <h1>Giám Sát Hôm Nay</h1>
            <p id="current-date">...</p>
        </header>

        <main id="task-list" class="task-list">
            <!-- Dữ liệu sẽ được JS render vào đây -->
            <div class="loading-spinner">Đang tải dữ liệu...</div>
        </main>
    </div>

    <!-- Màn hình 2: Quản Trị -->
    <div id="page-admin" class="page">
        <header class="app-header">
            <h1>Cài Đặt Hệ Thống</h1>
        </header>

        <div class="admin-container">
            <!-- Form Tòa Nhà -->
            <details class="admin-card">
                <summary>🏢 Thêm Tòa Nhà</summary>
                <form id="form-building">
                    <input type="text" id="building-name" placeholder="Tên tòa nhà (VD: Nhà A)" required>
                    <button type="submit" class="btn-primary">Lưu Tòa Nhà</button>
                </form>
            </details>

            <!-- Form Khu Vực -->
            <details class="admin-card">
                <summary>📍 Thêm Khu Vực</summary>
                <form id="form-area">
                    <select id="area-building-id" required></select>
                    <input type="text" id="area-name" placeholder="Tên khu vực (VD: Sảnh)" required>
                    <select id="area-type" required>
                        <option value="INDOOR">Trong nhà (Indoor)</option>
                        <option value="OUTDOOR">Ngoài trời (Outdoor)</option>
                    </select>
                    <button type="submit" class="btn-primary">Lưu Khu Vực</button>
                </form>
            </details>

            <!-- Form Công Việc -->
            <details class="admin-card">
                <summary>📝 Thêm Công Việc</summary>
                <form id="form-task">
                    <input type="text" id="task-name" placeholder="Tên công việc (VD: Quét nhà)" required>
                    <button type="submit" class="btn-primary">Lưu Công Việc</button>
                </form>
            </details>

            <!-- Form Lịch Trình -->
            <details class="admin-card">
                <summary>⏰ Gán Lịch Trình</summary>
                <form id="form-schedule">
                    <select id="sch-building" onchange="loadAreasForSchedule()" required></select>
                    <select id="sch-area" required></select>
                    <select id="sch-task" required></select>
                    <input type="time" id="sch-time" required>
                    <input type="text" id="sch-note" placeholder="Ghi chú (nếu có)">
                    <button type="submit" class="btn-primary">Lưu Lịch Trình</button>
                </form>
            </details>
        </div>
    </div>

    <!-- Bottom Navigation (Menu dưới đáy) -->
    <nav class="bottom-nav">
        <button id="btn-view" class="active" onclick="switchTab('view')">
            <span class="icon">📋</span>
            <span>Lịch Làm</span>
        </button>
        <button id="btn-admin" onclick="switchTab('admin')">
            <span class="icon">⚙️</span>
            <span>Quản Trị</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
