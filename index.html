<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lịch Hội Trường</title>
<style>
:root{--bg:#f5f7fa;--sf:#fff;--fg:#15202b;--mu:#5b6876;--ln:#d9e0e8;--ac:#1f4e79;--acf:#fff;--bad:#b3261e;--ok:#1b7a43}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--sf:#18212b;--fg:#e8eef4;--mu:#9aa8b6;--ln:#2b3745;--ac:#7fb2e0;--acf:#0b1620;--bad:#ff8a80;--ok:#5fcf8a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:14px max(14px,env(safe-area-inset-right)) 32px max(14px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 6px}
input[type=date]{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;box-sizing:border-box;min-width:0;flex:0 0 auto}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acf);padding:12px 16px}
button.alt{background:transparent;color:var(--ac);padding:6px 12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{background:transparent;color:var(--ac)}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--acf)}
.daybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.st{font-size:.88rem;color:var(--mu);flex:1 1 140px;min-width:0}
.st.err{color:var(--bad)}.st.ok{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ln);border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--fg);cursor:pointer;user-select:none;-webkit-user-select:none}
.chip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.chip .n{font-variant-numeric:tabular-nums;font-weight:700;opacity:.85}
.chip:focus-within{outline:3px solid var(--ac);outline-offset:2px}
.hint{font-size:.85rem;color:var(--mu);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 auto}
#out{display:flex;flex-direction:column;gap:18px}
#out .res{display:flex;flex-direction:column;gap:10px}
#out .res h3{margin:0;font-size:1rem}
#out img{width:100%;border:1px solid var(--ln);border-radius:6px;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-hall" aria-selected="true">Hội trường</button>
    <button type="button" role="tab" id="tab-eve" aria-selected="false">Lịch học tối</button>
  </div>
  <div class="daybar">
    <input type="date" id="day" aria-label="Chọn ngày">
    <span id="msg" class="st" role="status">Đang tải dữ liệu...</span>
    <button id="retry" class="alt" type="button" hidden>Thử lại</button>
  </div>
</section>
<section id="pick" hidden>
  <div><h2>Trạng thái</h2><div id="opts" class="chips"></div></div>
  <div><h2>Cột trong ảnh</h2><div id="cols" class="chips"></div></div>
  <div id="blkwrap" hidden>
    <h2>Toà nhà</h2>
    <div id="blks" class="chips"></div>
    <div class="chips" style="margin-top:8px"><label class="chip" id="splitchip"><input type="checkbox" id="split"><span>Tách ảnh riêng từng toà</span></label></div>
  </div>
  <button id="make" type="button">Tạo ảnh</button>
</section>
<section id="outwrap" hidden><div id="out"></div></section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fmt(d){return d.split('-').reverse().join('/')}
function msg(t,c){var m=$('msg');m.textContent=t;m.className='st '+(c||'');$('retry').hidden=(c!=='err')}
function addDays(ds,n){var d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

var HALL={'ht-tong-hop':'HT Tổng hợp','ht-nhan-van':'HT Nhân văn'};
var HSTL={FREE:'Còn trống',CONFIRMED:'Đã duyệt',PENDING:'Chờ duyệt',NEEDS_INFO:'Yêu cầu bổ sung'};
// Giờ của từng ca hội trường. Điền giờ thật vào đây, ví dụ 'ca-1':'07:00 - 11:30'. Để trống thì ảnh ghi "Ca 1".
var SHIFT_T={'ca-1':'','ca-2':'','ca-3':''};
var COL={'Còn trống':'#4a5662','Đã duyệt':'#136a37','Chờ duyệt':'#8a4b00','Yêu cầu bổ sung':'#a8201a','Chờ bổ sung':'#a8201a','Đang mượn':'#1f4e79'};
var COLS={hall:{h:['Hội trường','Giờ','Trạng thái','Đơn vị / Ghi chú'],w:[210,230,190,0],st:2,title:'LỊCH ĐĂNG KÝ HỘI TRƯỜNG'},eve:{h:['Phòng','Sức chứa','Giờ','Trạng thái','Đơn vị / Ghi chú'],w:[170,130,220,190,0],st:3,title:'PHÒNG HỌC TỐI'}};
var TAB='hall',HD=[],ED=null,G={},CUR='',REQ=0;

function chip(parent,val,text,count,checked,onchg){
  var l=document.createElement('label');l.className='chip'+(checked?' on':'');
  var i=document.createElement('input');i.type='checkbox';i.value=val;i.checked=checked;
  var s=document.createElement('span');s.textContent=text;
  l.appendChild(i);l.appendChild(s);
  if(count!==undefined&&count!==null){var n=document.createElement('span');n.className='n';n.textContent=count;l.appendChild(n)}
  i.addEventListener('change',function(){l.classList.toggle('on',i.checked);if(onchg)onchg()});
  parent.appendChild(l);return i;
}
function checked(id){return [].slice.call($(id).querySelectorAll('input')).filter(function(i){return i.checked}).map(function(i){return i.value})}

$('day').value=new Date(Date.now()+25200000).toISOString().slice(0,10);
try{if(ls('hs_split')==='1'){$('split').checked=true;$('splitchip').classList.add('on')}}catch(e){}
$('split').addEventListener('change',function(){$('splitchip').classList.toggle('on',$('split').checked);ls('hs_split',$('split').checked?'1':'0')});

function setTab(t){
  TAB=t;
  $('tab-hall').setAttribute('aria-selected',t=='hall');
  $('tab-eve').setAttribute('aria-selected',t=='eve');
  $('opts').innerHTML='';$('pick').hidden=true;$('outwrap').hidden=true;$('blkwrap').hidden=true;
  renderCols();load();
}
$('tab-hall').onclick=function(){setTab('hall')};
$('tab-eve').onclick=function(){setTab('eve')};
$('retry').onclick=function(){load()};
var tm=null;
function dayChanged(){clearTimeout(tm);tm=setTimeout(load,150)}
$('day').addEventListener('change',dayChanged);
$('day').addEventListener('input',dayChanged);

function getJSON(url){
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('Máy chủ trường trả lỗi '+r.status);return r.json();
  });
}
function load(){
  var ds=$('day').value;if(!ds){msg('Hãy chọn ngày.','err');return}
  var my=++REQ;msg('Đang tải dữ liệu...');
  var p;
  if(TAB=='hall')p=getJSON('/api/bookings?t='+Date.now()).then(function(j){
    var arr=Array.isArray(j)?j:j.data;if(!Array.isArray(arr))throw new Error('Dữ liệu không đúng dạng.');
    if(my!==REQ)return;HD=arr.filter(function(x){return HALL[x.hall]});buildHall();
  });
  else p=getJSON('/api/classes?from='+addDays(ds,-1)+'&days=3&t='+Date.now()).then(function(j){
    if(!j||!Array.isArray(j.rooms)||!Array.isArray(j.slots))throw new Error('Dữ liệu không đúng dạng.');
    if(my!==REQ)return;ED=j;buildEve();
  });
  p.catch(function(e){if(my===REQ)msg('Không tải được: '+e.message,'err')});
}

function selCols(){return checked('cols').map(Number)}
function saveCols(){ls('hs_cols_'+TAB,JSON.stringify(selCols()))}
function renderCols(){
  var C=COLS[TAB],saved=null;try{saved=JSON.parse(ls('hs_cols_'+TAB))}catch(e){}
  var el=$('cols');el.innerHTML='';
  C.h.forEach(function(h,i){chip(el,i,h,null,Array.isArray(saved)?saved.indexOf(i)>=0:true,saveCols)});
}
function renderOpts(ks,labelFn,defKey){
  var keep={};[].slice.call($('opts').querySelectorAll('input')).forEach(function(i){keep[i.value]=i.checked});
  var had=Object.keys(keep).length>0;
  var o=$('opts');o.innerHTML='';
  ks.forEach(function(k){chip(o,k,labelFn(k),G[k]?G[k].length:0,had&&k in keep?keep[k]:(k===defKey))});
  $('pick').hidden=false;
}

function shiftLabel(c){
  var t=SHIFT_T[c];if(t)return t;
  var m=/^ca-(\d+)$/.exec(c);return m?'Ca '+m[1]:c;
}
function buildHall(){
  var d=$('day').value;CUR=d;
  var D=HD.filter(function(x){return String(x.usageDate).slice(0,10)==d});
  var ss=['ca-1','ca-2','ca-3'];HD.forEach(function(x){if(ss.indexOf(x.shift)<0)ss.push(x.shift)});
  G={FREE:[]};
  D.forEach(function(x){var k=x.status||'(không có)';(G[k]=G[k]||[]).push({key:x.hall,sk:x.shift,lab:HSTL[k]||k,c:[HALL[x.hall],shiftLabel(x.shift),HSTL[k]||k,[x.organization,x.purpose].filter(Boolean).join(' - ')]})});
  Object.keys(HALL).forEach(function(h){ss.forEach(function(s){if(!D.some(function(x){return x.hall==h&&x.shift==s}))G.FREE.push({key:h,sk:s,lab:'Còn trống',c:[HALL[h],shiftLabel(s),'Còn trống','']})})});
  var ks=['FREE','CONFIRMED','PENDING','NEEDS_INFO'];Object.keys(G).forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)});
  renderOpts(ks,function(k){return HSTL[k]||('Mã lạ: '+k)},'CONFIRMED');
  $('blkwrap').hidden=true;
  msg('Ngày '+fmt(d)+': '+D.length+' đơn.','ok');
}

function hm(x){return('0'+x.getUTCHours()).slice(-2)+':'+('0'+x.getUTCMinutes()).slice(-2)}
function bk(r,id){return r&&r.block?String(r.block):String(id).split('-')[0]}
function rl(r){if(!r)return'';if(r.name)return r.name;var id=String(r.id);return(r.block&&id.indexOf(r.block)!==0)?r.block+'-'+id:id}
function lab(s){
  var u=String(s).toUpperCase();
  if(u==='APPROVED')return'Đã duyệt';
  if(/SUPPL|INFO|ADD|MORE|NEED|REVIS/.test(u))return'Chờ bổ sung';
  if(/PEND|WAIT|SUBMIT|REVIEW/.test(u))return'Chờ duyệt';
  if(/BORROW|IN_USE|USING|ACTIVE|ONGOING|OCCUP|CHECKED/.test(u))return'Đang mượn';
  return s;
}
function renderBlks(){
  var keep={};[].slice.call($('blks').querySelectorAll('input')).forEach(function(i){keep[i.value]=i.checked});
  var set={};Object.keys(G).forEach(function(k){G[k].forEach(function(r){set[r.blk]=1})});
  ED.rooms.forEach(function(r){set[bk(r,r.id)]=1});
  var el=$('blks');el.innerHTML='';
  Object.keys(set).sort().forEach(function(b){chip(el,b,'Toà '+b,null,(b in keep)?keep[b]:true)});
  $('blkwrap').hidden=false;
}
function buildEve(){
  var ds=$('day').value;CUR=ds;
  var rm={};ED.rooms.forEach(function(r){rm[r.id]=r});
  var sl=[];
  ED.slots.forEach(function(s){
    var a=new Date(new Date(s.starts_at).getTime()+252e5),b=new Date(new Date(s.ends_at).getTime()+252e5);
    if(a.toISOString().slice(0,10)!==ds)return;
    sl.push({id:s.room_id,st:s.status,t:hm(a)+' - '+hm(b),u:s.unit||''});
  });
  var occ={};sl.forEach(function(s){if(!/REJECT|DENY|^CANCELL?ED$/i.test(s.st))occ[s.id]=1});
  var dow=new Date(ds+'T00:00:00Z').getUTCDay();
  var win=dow===0?'06:30 - 11:30':'17:00 - 20:30';
  G={'Còn trống':[]};
  ED.rooms.forEach(function(r){if(r.booking_open!==false&&!occ[r.id])G['Còn trống'].push({blk:bk(r,r.id),key:rl(r),sk:win,lab:'Còn trống',c:[rl(r),String(r.capacity==null?'':r.capacity),win,'Còn trống',r.note||'']})});
  sl.forEach(function(s){var L=lab(s.st),rr=rm[s.id]||{id:s.id};(G[L]=G[L]||[]).push({blk:bk(rm[s.id],s.id),key:rl(rr),sk:s.t,lab:L,c:[rl(rr),String(rr.capacity==null?'':rr.capacity),s.t,L,s.u]})});
  var base=['Còn trống','Đã duyệt','Đang mượn','Chờ duyệt','Chờ bổ sung'];
  var ks=base.slice();Object.keys(G).forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)});
  renderOpts(ks,function(k){return base.indexOf(k)<0?'Mã lạ: '+k:k},'Đã duyệt');
  renderBlks();
  msg('Ngày '+fmt(ds)+': '+sl.length+' lượt có lịch, '+G['Còn trống'].length+' phòng trống.','ok');
}

$('make').onclick=function(){
  if(!CUR)return;
  var sel=checked('opts');
  if(!sel.length){msg('Chưa chọn trạng thái nào.','err');return}
  var rows=[];sel.forEach(function(k){rows=rows.concat(G[k]||[])});
  if(!rows.length){msg('Các mục đã chọn đều có 0 dòng.','err');return}
  rows.sort(function(a,b){return a.key<b.key?-1:a.key>b.key?1:a.sk<b.sk?-1:a.sk>b.sk?1:0});
  var names=sel.map(function(k){return HSTL[k]||k});
  var C=COLS[TAB],idx=selCols();
  if(!idx.length){msg('Chưa chọn cột nào.','err');return}
  var heads=idx.map(function(i){return C.h[i]}),cw=idx.map(function(i){return C.w[i]}),sc=idx.indexOf(C.st);
  function cp(list){return list.map(function(r){return{key:r.key,sk:r.sk,lab:r.lab,c:idx.map(function(i){return r.c[i]})}})}
  $('out').innerHTML='';
  if(TAB!='eve'){draw(cp(rows),C.title,names,heads,cw,sc,'')}
  else{
    var all=[].slice.call($('blks').querySelectorAll('input')),bs=checked('blks');
    if(!bs.length){msg('Chưa chọn toà nào.','err');return}
    rows=rows.filter(function(r){return bs.indexOf(r.blk)>=0});
    if(!rows.length){msg('Các toà đã chọn không có dòng nào.','err');return}
    if($('split').checked){
      bs.forEach(function(b){
        var g=rows.filter(function(r){return r.blk===b});
        if(g.length)draw(cp(g),C.title+' - TOÀ '+b,names,heads,cw,sc,b);
      });
    }else{
      var nm=names.slice();if(bs.length<all.length)nm.push('Toà '+bs.join(', '));
      draw(cp(rows),C.title,nm,heads,cw,sc,bs.length<all.length?bs.join('-'):'');
    }
  }
  setTimeout(function(){$('out').scrollIntoView({behavior:'smooth',block:'start'})},50);
};

function draw(rows,title,names,heads,CW,stCol,fname){
  var P=36,F=40,LH=54,PAD=24,CAP=440,NOTE_W=480,MINW=720;
  var FF='-apple-system,"Helvetica Neue",Arial,sans-serif';
  var c=document.createElement('canvas'),x=c.getContext('2d');
  function wrap(t,w){var o=[],l='';String(t||'').split(/\s+/).forEach(function(wd){var m=l?l+' '+wd:wd;if(x.measureText(m).width>w&&l){o.push(l);l=wd}else l=m});if(l)o.push(l);return o.length?o:['']}
  var n=heads.length,W2=[];
  heads.forEach(function(h,i){
    if(CW[i]===0){W2[i]=NOTE_W;return}
    x.font='bold '+F+'px '+FF;var m=x.measureText(h).width;
    rows.forEach(function(r){x.font=(i==stCol?'bold ':'')+F+'px '+FF;m=Math.max(m,x.measureText(r.c[i]).width)});
    W2[i]=Math.min(CAP,Math.ceil(m)+2*PAD);
  });
  var sum=0;W2.forEach(function(w){sum+=w});
  var W=Math.max(MINW,sum+2*P);
  if(W>sum+2*P){var f=(W-2*P)/sum;W2=W2.map(function(w){return Math.floor(w*f)})}
  x.font='bold 52px '+FF;var tl=wrap(title,W-2*P);
  var wd=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][new Date(CUR+'T00:00:00Z').getUTCDay()];
  x.font='38px '+FF;var dl=wrap(wd+', '+fmt(CUR),W-2*P);
  x.font='30px '+FF;var fl=wrap('Hiển thị: '+names.join(', ')+' ('+rows.length+' dòng)',W-2*P);
  x.font=F+'px '+FF;
  rows.forEach(function(r){
    r.L=r.c.map(function(t,i){x.font=(i==stCol?'bold ':'')+F+'px '+FF;return wrap(t,W2[i]-2*PAD)});
    r.H=Math.max.apply(null,r.L.map(function(a){return a.length}))*LH+24;
  });
  var HH=LH+24;
  var top=P+tl.length*64+dl.length*52+fl.length*40+28;
  var H=top+HH+rows.reduce(function(s,r){return s+r.H},0)+P;
  var sc=Math.min(1,Math.sqrt(14e6/(W*H)));
  c.width=Math.floor(W*sc);c.height=Math.floor(H*sc);
  x=c.getContext('2d');x.scale(sc,sc);
  function base(y0,lh,fs){return y0+(lh-fs)/2+fs*0.82}
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  var y=P;
  x.fillStyle='#0b1620';x.font='bold 52px '+FF;
  tl.forEach(function(t,j){x.fillText(t,P,base(y+j*64,64,52))});y+=tl.length*64;
  x.font='38px '+FF;
  dl.forEach(function(t,j){x.fillText(t,P,base(y+j*52,52,38))});y+=dl.length*52;
  x.font='30px '+FF;x.fillStyle='#4a5662';
  fl.forEach(function(t,j){x.fillText(t,P,base(y+j*40,40,30))});y=top;
  x.fillStyle='#1f4e79';x.fillRect(P,y,W-2*P,HH);
  x.fillStyle='#fff';x.font='bold '+F+'px '+FF;
  var cx=P;heads.forEach(function(t,i){x.fillText(t,cx+PAD,base(y+12,LH,F));cx+=W2[i]});
  y+=HH;
  rows.forEach(function(r,k){
    x.fillStyle=(k&1)?'#e9f0f8':'#fff';x.fillRect(P,y,W-2*P,r.H);
    var cx=P;
    r.L.forEach(function(a,i){
      x.fillStyle=(i==stCol)?(COL[r.lab]||'#0b1620'):'#0b1620';
      x.font=(i==stCol?'bold ':'')+F+'px '+FF;
      a.forEach(function(t,j){x.fillText(t,cx+PAD,base(y+12+j*LH,LH,F))});
      cx+=W2[i];
    });
    x.strokeStyle='#c9d3de';x.lineWidth=1;x.beginPath();x.moveTo(P,y+r.H);x.lineTo(W-P,y+r.H);x.stroke();
    y+=r.H;
  });
  var out=document.createElement('div');out.className='res';$('out').appendChild(out);
  var h3=document.createElement('h3');h3.textContent=title;out.appendChild(h3);
  var row=document.createElement('div');row.className='row';
  var sb=document.createElement('button');sb.type='button';sb.textContent='Lưu / Chia sẻ';
  row.appendChild(sb);out.appendChild(row);
  var st=document.createElement('div');st.className='st';out.appendChild(st);
  var hint=document.createElement('p');hint.className='hint';hint.textContent='Hoặc nhấn giữ vào ảnh rồi chọn Lưu vào Ảnh.';out.appendChild(hint);
  var im=document.createElement('img');im.alt='Ảnh '+title;im.src=c.toDataURL('image/png');out.appendChild(im);
  var BLOB=null;c.toBlob(function(b){BLOB=b});
  sb.onclick=function(){
    if(!BLOB){st.textContent='Ảnh chưa sẵn sàng, bấm lại sau 1 giây.';st.className='st err';return}
    var f=new File([BLOB],(TAB=='hall'?'hoi-truong-':'phong-hoc-toi-')+(fname?fname+'-':'')+CUR+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:title+' '+fmt(CUR)}).catch(function(){})}
    else{st.textContent='Máy không hỗ trợ chia sẻ. Hãy nhấn giữ vào ảnh để lưu.';st.className='st err'}
  };
  $('outwrap').hidden=false;
}

renderCols();
load();
})();
</script>
</body>
</html>
