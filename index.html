<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thiết Lập Khu Vực</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="global-loader" class="global-loader hidden">
        <div class="spinner"></div>
    </div>

    <div id="toast" class="toast">Thành công!</div>

    <!-- Overlay làm mờ nền khi mở Menu -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="UI.closeDrawer()"></div>

    <!-- Menu Drawer (Trượt từ trái sang) -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Danh Sách Tòa Nhà</h2>
        </div>
        <div id="building-list" class="building-list">
            <!-- Danh sách tòa nhà sẽ được JS render vào đây -->
        </div>
        <div class="sidebar-footer">
            <button class="btn-add-building" onclick="UI.openAddBuildingModal()">
                <span>+</span> Thêm Tòa Nhà Mới
            </button>
        </div>
    </aside>

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="menu-btn" onclick="UI.openDrawer()">☰</button>
            <div class="header-title-group">
                <div class="title-row">
                    <h1 id="header-title">Đang tải...</h1>
                    <button id="btn-edit-building" class="icon-btn" onclick="UI.openEditBuildingModal()" style="display: none;">✏️</button>
                </div>
                <p id="header-subtitle">Vuốt trái để xoá khu vực • Nhấn giữ để thêm giờ</p>
            </div>
        </div>
    </header>

    <!-- Danh sách Khu vực -->
    <main id="area-list" class="area-list">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </main>

    <!-- Nút Thêm Khu Vực (+) -->
    <button id="fab-add" class="fab" onclick="UI.openAddAreaModal()">+</button>

    <!-- ================= MODAL: THÊM/SỬA TÒA NHÀ ================= -->
    <div id="modal-building" class="modal-overlay" onclick="UI.closeModal('modal-building')">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2 id="building-modal-title">Thêm Tòa Nhà</h2>
                <button class="close-btn" onclick="UI.closeModal('modal-building')">✕</button>
            </div>
            <form id="form-building" class="sheet-form">
                <input type="text" id="building-name" placeholder="Tên tòa nhà (VD: Nhà A, B1...)" required maxlength="50">
                <button type="submit" class="btn-primary" id="btn-save-building">Lưu Tòa Nhà</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: THÊM KHU VỰC ================= -->
    <div id="modal-area" class="modal-overlay" onclick="UI.closeModal('modal-area')">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2>Thêm Khu Vực Mới</h2>
                <button class="close-btn" onclick="UI.closeModal('modal-area')">✕</button>
            </div>
            <form id="form-area" class="sheet-form">
                <input type="text" id="area-name" placeholder="Tên khu vực (VD: Sảnh, Sân sau...)" required maxlength="50">
                <select id="area-type" required class="form-select">
                    <option value="INDOOR">🏢 Trong nhà (Sảnh, Phòng...)</option>
                    <option value="OUTDOOR">🌳 Ngoài trời (Sân, Ngoại cảnh...)</option>
                </select>
                <button type="submit" class="btn-primary" id="btn-save-area">Tạo Khu Vực</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: THÊM GIỜ LÀM VIỆC ================= -->
    <div id="modal-schedule" class="modal-overlay" onclick="UI.closeModal('modal-schedule')">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2 id="schedule-area-title">Thêm Giờ Làm Việc</h2>
                <button class="close-btn" onclick="UI.closeModal('modal-schedule')">✕</button>
            </div>
            
            <div id="schedule-rows"></div>

            <div class="sheet-actions">
                <button type="button" class="btn-outline" onclick="UI.addScheduleRow()">+ Thêm dòng</button>
                <button type="button" class="btn-primary" id="btn-save-schedules" onclick="App.saveSchedules()">Lưu Tất Cả</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
