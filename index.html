<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lịch Hội Trường</title>
<style>
:root{--bg:#f5f7fa;--sf:#fff;--fg:#15202b;--mu:#5b6876;--ln:#d9e0e8;--ac:#1f4e79;--acf:#fff;--bad:#b3261e;--ok:#1b7a43}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--sf:#18212b;--fg:#e8eef4;--mu:#9aa8b6;--ln:#2b3745;--ac:#7fb2e0;--acf:#0b1620;--bad:#ff8a80;--ok:#5fcf8a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0}.sub{color:var(--mu);margin:4px 0 0;font-size:.9rem}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0}
input[type=date],input[type=text]{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%;box-sizing:border-box;min-width:0}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acf);padding:11px 16px}
button.alt{background:transparent;color:var(--ac)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{background:transparent;color:var(--ac)}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--acf)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.hint{font-size:.85rem;color:var(--mu);margin:0}
.st{font-size:.9rem;min-height:1.3em}.err{color:var(--bad)}.ok{color:var(--ok)}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shifts label{font-size:.8rem;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.shifts input{padding:8px;font-size:15px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln);font-size:1.05rem}
.opt input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.opt .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--mu)}
#out{display:flex;flex-direction:column;gap:10px}
#out img{width:100%;border:1px solid var(--ln);border-radius:6px;display:block}
#dbgout{width:100%;height:280px;box-sizing:border-box;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Lịch Hội Trường</h1><p class="sub">Hội trường và lịch học tối. Dữ liệu lấy mới từ web trường mỗi lần mở.</p></header>
<section>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-hall" aria-selected="true">Hội trường</button>
    <button type="button" role="tab" id="tab-eve" aria-selected="false">Lịch học tối</button>
  </div>
  <h2>Ngày</h2>
  <input type="date" id="day" aria-label="Chọn ngày">
  <div class="row"><button id="reload" class="alt" type="button">Tải lại dữ liệu</button></div>
  <div id="msg" class="st" role="status">Đang tải dữ liệu...</div>
  <div class="row" id="dbgrow" hidden><button id="dbg" class="alt" type="button">Xem dữ liệu thô để gửi Claude</button></div>
  <textarea id="dbgout" hidden aria-label="Dữ liệu thô"></textarea>
  <div id="shiftbox" class="shifts">
    <label>Giờ ca 1<input type="text" id="s1" placeholder="vd 7:00-11:30"></label>
    <label>Giờ ca 2<input type="text" id="s2" placeholder="vd 13:00-17:00"></label>
    <label>Giờ ca 3<input type="text" id="s3" placeholder="vd 18:00-21:00"></label>
  </div>
</section>
<section id="pick" hidden>
  <h2>Chọn trạng thái</h2>
  <div id="opts"></div>
  <div class="row"><button id="make" type="button">Tạo ảnh</button></div>
</section>
<section id="outwrap" hidden><h2>Ảnh</h2><div id="out"></div></section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fmt(d){return d.split('-').reverse().join('/')}
function msg(t,c){var m=$('msg');m.textContent=t;m.className='st '+(c||'')}
function addDays(ds,n){var d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

var HALL={'ht-tong-hop':'HT Tổng hợp','ht-nhan-van':'HT Nhân văn'};
var HSTL={FREE:'Còn trống',CONFIRMED:'Đã duyệt',PENDING:'Chờ duyệt',NEEDS_INFO:'Yêu cầu bổ sung'};
var COL={'Còn trống':'#5b6876','Đã duyệt':'#1b7a43','Chờ duyệt':'#a15c00','Yêu cầu bổ sung':'#b3261e','Chờ bổ sung':'#b3261e','Đang mượn':'#1f4e79'};
var TAB='hall',HD=[],ED=null,G={},CUR='',BLOB=null;

$('day').value=new Date(Date.now()+25200000).toISOString().slice(0,10);
['s1','s2','s3'].forEach(function(id){var v=ls('hs_'+id);if(v)$(id).value=v;$(id).addEventListener('input',function(){ls('hs_'+id,$(id).value)})});

function setTab(t){
  TAB=t;
  $('tab-hall').setAttribute('aria-selected',t=='hall');
  $('tab-eve').setAttribute('aria-selected',t=='eve');
  $('shiftbox').hidden=(t!='hall');
  $('dbgrow').hidden=(t!='eve');$('dbgout').hidden=true;
  $('pick').hidden=true;$('outwrap').hidden=true;
  load();
}
$('tab-hall').onclick=function(){setTab('hall')};
$('tab-eve').onclick=function(){setTab('eve')};
$('reload').onclick=load;
$('day').addEventListener('change',function(){if(TAB=='hall'){if(HD.length)buildHall()}else load()});

function getJSON(url){
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('Máy chủ trường trả lỗi '+r.status);return r.json();
  });
}
function load(){
  msg('Đang tải dữ liệu...');
  if(TAB=='hall'){
    getJSON('/api/bookings?t='+Date.now()).then(function(j){
      var arr=Array.isArray(j)?j:j.data;if(!Array.isArray(arr))throw new Error('Dữ liệu không đúng dạng.');
      HD=arr.filter(function(x){return HALL[x.hall]});
      msg('Đã cập nhật lúc '+new Date().toLocaleTimeString('vi-VN')+' ('+HD.length+' đơn của 2 hội trường).','ok');
      buildHall();
    }).catch(function(e){msg('Không tải được: '+e.message,'err')});
  }else{
    var ds=$('day').value;if(!ds){msg('Hãy chọn ngày.','err');return}
    getJSON('/api/classes?from='+addDays(ds,-1)+'&days=3&t='+Date.now()).then(function(j){
      if(!j||!Array.isArray(j.rooms)||!Array.isArray(j.slots))throw new Error('Dữ liệu không đúng dạng.');
      ED=j;
      msg('Đã cập nhật lúc '+new Date().toLocaleTimeString('vi-VN')+' ('+j.rooms.length+' phòng).','ok');
      buildEve();
    }).catch(function(e){msg('Không tải được: '+e.message,'err')});
  }
}

function renderOpts(ks,labelFn,defKey){
  var keep={};[].slice.call($('opts').querySelectorAll('input')).forEach(function(i){keep[i.value]=i.checked});
  var had=Object.keys(keep).length>0;
  var o=$('opts');o.innerHTML='';
  ks.forEach(function(k){
    var l=document.createElement('label');l.className='opt';
    var c=document.createElement('input');c.type='checkbox';c.value=k;c.checked=had&&k in keep?keep[k]:(k===defKey);
    var s=document.createElement('span');s.textContent=labelFn(k);
    var n=document.createElement('span');n.className='n';n.textContent=G[k]?G[k].length:0;
    l.appendChild(c);l.appendChild(s);l.appendChild(n);o.appendChild(l);
  });
  $('pick').hidden=false;
}

function buildHall(){
  var d=$('day').value;CUR=d;if(!d)return;
  var D=HD.filter(function(x){return String(x.usageDate).slice(0,10)==d});
  var ss=['ca-1','ca-2','ca-3'];HD.forEach(function(x){if(ss.indexOf(x.shift)<0)ss.push(x.shift)});
  G={FREE:[]};
  D.forEach(function(x){var k=x.status||'(không có)';(G[k]=G[k]||[]).push({key:x.hall,sk:x.shift,lab:HSTL[k]||k,c:[HALL[x.hall],shiftLabel(x.shift),HSTL[k]||k,[x.organization,x.purpose].filter(Boolean).join(' - ')]})});
  Object.keys(HALL).forEach(function(h){ss.forEach(function(s){if(!D.some(function(x){return x.hall==h&&x.shift==s}))G.FREE.push({key:h,sk:s,lab:'Còn trống',c:[HALL[h],shiftLabel(s),'Còn trống','']})})});
  var ks=['FREE','CONFIRMED','PENDING','NEEDS_INFO'];Object.keys(G).forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)});
  renderOpts(ks,function(k){return HSTL[k]||('Mã lạ: '+k)},'CONFIRMED');
}
function shiftLabel(c){var m=/^ca-(\d+)$/.exec(c);if(!m)return c;var t=($('s'+m[1])||{}).value;return 'Ca '+m[1]+(t&&t.trim()?' ('+t.trim()+')':'')}

function hm(x){return('0'+x.getUTCHours()).slice(-2)+':'+('0'+x.getUTCMinutes()).slice(-2)}
function lab(s){
  var u=String(s).toUpperCase();
  if(u==='APPROVED')return'Đã duyệt';
  if(/SUPPL|INFO|ADD|MORE|NEED|REVIS/.test(u))return'Chờ bổ sung';
  if(/PEND|WAIT|SUBMIT|REVIEW/.test(u))return'Chờ duyệt';
  if(/BORROW|IN_USE|USING|ACTIVE|ONGOING|OCCUP|CHECKED/.test(u))return'Đang mượn';
  return s;
}
function buildEve(){
  var ds=$('day').value;CUR=ds;if(!ds||!ED)return;
  var rm={};ED.rooms.forEach(function(r){rm[r.id]=r});
  var sl=[];
  ED.slots.forEach(function(s){
    var a=new Date(new Date(s.starts_at).getTime()+252e5),b=new Date(new Date(s.ends_at).getTime()+252e5);
    if(a.toISOString().slice(0,10)!==ds)return;
    sl.push({id:s.room_id,st:s.status,t:hm(a)+' - '+hm(b),u:s.unit||''});
  });
  var occ={};sl.forEach(function(s){if(!/REJECT|CANCEL|DENY/i.test(s.st))occ[s.id]=1});
  var dow=new Date(ds+'T00:00:00Z').getUTCDay();
  var win=dow===0?'06:30 - 11:30':'17:00 - 20:30';
  G={'Còn trống':[]};
  ED.rooms.forEach(function(r){if(r.booking_open!==false&&!occ[r.id])G['Còn trống'].push({key:r.id,sk:win,lab:'Còn trống',c:[r.id,String(r.capacity==null?'':r.capacity),win,'Còn trống',r.note||'']})});
  sl.forEach(function(s){var L=lab(s.st);(G[L]=G[L]||[]).push({key:s.id,sk:s.t,lab:L,c:[s.id,String(((rm[s.id]||{}).capacity)==null?'':rm[s.id].capacity),s.t,L,s.u]})});
  var ks=['Còn trống','Đã duyệt','Đang mượn','Chờ duyệt','Chờ bổ sung'];
  Object.keys(G).forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)});
  renderOpts(ks,function(k){return ['Còn trống','Đã duyệt','Đang mượn','Chờ duyệt','Chờ bổ sung'].indexOf(k)<0?'Mã lạ: '+k:k},'Đã duyệt');
  msg('Ngày '+fmt(ds)+': '+sl.length+' lượt có lịch, '+G['Còn trống'].length+' phòng còn trống.','ok');
}

$('make').onclick=function(){
  if(!CUR)return;
  var sel=[].slice.call($('opts').querySelectorAll('input')).filter(function(i){return i.checked}).map(function(i){return i.value});
  if(!sel.length){msg('Chưa chọn trạng thái nào.','err');return}
  var rows=[];sel.forEach(function(k){rows=rows.concat(G[k]||[])});
  if(!rows.length){msg('Các mục đã chọn đều có 0 dòng.','err');return}
  rows.sort(function(a,b){return a.key<b.key?-1:a.key>b.key?1:a.sk<b.sk?-1:a.sk>b.sk?1:0});
  var names=sel.map(function(k){return HSTL[k]||k});
  if(TAB=='hall')draw(rows,'LỊCH ĐĂNG KÝ HỘI TRƯỜNG',names,['Hội trường','Giờ','Trạng thái','Đơn vị / Ghi chú'],[210,230,190,0],2);
  else draw(rows,'PHÒNG HỌC TỐI',names,['Phòng','Sức chứa','Giờ','Trạng thái','Đơn vị / Ghi chú'],[170,130,220,190,0],3);
};

function draw(rows,title,names,heads,CW,stCol){
  var W=1200,P=30,LH=28;
  var sum=0;CW.forEach(function(w){sum+=w});CW[CW.length-1]=W-2*P-sum;
  var F='-apple-system,"Helvetica Neue",Arial,sans-serif';
  var c=document.createElement('canvas'),x=c.getContext('2d');
  function wrap(t,w){var o=[],l='';String(t||'').split(/\s+/).forEach(function(wd){var m=l?l+' '+wd:wd;if(x.measureText(m).width>w&&l){o.push(l);l=wd}else l=m});if(l)o.push(l);return o.length?o:['']}
  x.font='20px '+F;
  var fl=wrap('Hiển thị: '+names.join(', ')+' ('+rows.length+' dòng)',W-2*P);
  x.font='22px '+F;
  rows.forEach(function(r){
    r.L=r.c.map(function(t,i){return wrap(t,CW[i]-20)});
    r.H=Math.max.apply(null,r.L.map(function(a){return a.length}))*LH+16;
  });
  var top=P+36+40+fl.length*26+20;
  var H=top+44+rows.reduce(function(s,r){return s+r.H},0)+P;
  c.width=W;c.height=H;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#15202b';x.font='bold 36px '+F;x.fillText(title,P,P+36);
  var wd=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][new Date(CUR+'T00:00:00Z').getUTCDay()];
  x.font='26px '+F;x.fillText(wd+', '+fmt(CUR),P,P+76);
  x.font='20px '+F;x.fillStyle='#5b6876';fl.forEach(function(l,i){x.fillText(l,P,P+76+26*(i+1))});
  var y=top;
  x.fillStyle='#1f4e79';x.fillRect(P,y,W-2*P,44);
  x.fillStyle='#fff';x.font='bold 22px '+F;
  var cx=P;heads.forEach(function(t,i){x.fillText(t,cx+10,y+30);cx+=CW[i]});
  y+=44;
  rows.forEach(function(r,n){
    x.fillStyle=(n&1)?'#eef3f9':'#fff';x.fillRect(P,y,W-2*P,r.H);
    var cx=P;
    r.L.forEach(function(a,i){
      x.fillStyle=(i==stCol)?(COL[r.lab]||'#15202b'):'#15202b';
      x.font=(i==stCol?'bold ':'')+'22px '+F;
      a.forEach(function(t,j){x.fillText(t,cx+10,y+8+LH*(j+1)-6)});
      cx+=CW[i];
    });
    x.strokeStyle='#d9e0e8';x.beginPath();x.moveTo(P,y+r.H);x.lineTo(W-P,y+r.H);x.stroke();
    y+=r.H;
  });
  var out=$('out');out.innerHTML='';
  var row=document.createElement('div');row.className='row';
  var sb=document.createElement('button');sb.type='button';sb.textContent='Lưu / Chia sẻ';
  row.appendChild(sb);out.appendChild(row);
  var st=document.createElement('div');st.className='st';out.appendChild(st);
  var hint=document.createElement('p');hint.className='hint';hint.textContent='Hoặc nhấn giữ vào ảnh rồi chọn Lưu vào Ảnh.';out.appendChild(hint);
  var im=document.createElement('img');im.alt='Ảnh '+title;im.src=c.toDataURL('image/png');out.appendChild(im);
  BLOB=null;c.toBlob(function(b){BLOB=b});
  sb.onclick=function(){
    if(!BLOB){st.textContent='Ảnh chưa sẵn sàng, bấm lại sau 1 giây.';st.className='st err';return}
    var f=new File([BLOB],(TAB=='hall'?'hoi-truong-':'phong-hoc-toi-')+CUR+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:title+' '+fmt(CUR)}).catch(function(){})}
    else{st.textContent='Máy không hỗ trợ chia sẻ. Hãy nhấn giữ vào ảnh để lưu.';st.className='st err'}
  };
  $('outwrap').hidden=false;$('outwrap').scrollIntoView({behavior:'smooth'});
}
$('dbg').onclick=function(){
  var t=$('dbgout');t.hidden=false;
  if(!ED){t.value='Chưa có dữ liệu. Bấm Tải lại dữ liệu rồi thử lại.';return}
  function sh(v){var s=JSON.stringify(v);return s.length>700?s.slice(0,700)+'…':s}
  var L=[];
  L.push('NGÀY ĐANG CHỌN: '+$('day').value+' (dữ liệu tải 3 ngày quanh ngày này)');
  L.push('KHOÁ CẤP 1: '+Object.keys(ED).map(function(k){var v=ED[k];return k+'('+(Array.isArray(v)?'mảng '+v.length:typeof v)+')'}).join(', '));
  Object.keys(ED).forEach(function(k){if(k!='rooms'&&k!='slots'&&Array.isArray(ED[k])&&ED[k].length)L.push('MẪU '+k+'[0]: '+sh(ED[k][0]))});
  var kinds={};ED.rooms.forEach(function(r){var k=String(r.kind);if(!kinds[k])kinds[k]={n:0,s:r};kinds[k].n++});
  L.push('\n== LOẠI PHÒNG (kind) ==');
  Object.keys(kinds).forEach(function(k){L.push(k+' x'+kinds[k].n+'  mẫu: '+sh(kinds[k].s))});
  var ks={};ED.slots.forEach(function(s){var k=Object.keys(s).sort().join(',');if(!ks[k])ks[k]={n:0,s:s};ks[k].n++});
  L.push('\n== CÁC DẠNG SLOT (theo bộ khoá) ==');
  Object.keys(ks).forEach(function(k){L.push('['+k+'] x'+ks[k].n+'  mẫu: '+sh(ks[k].s))});
  var st={};ED.slots.forEach(function(s){st[s.status]=(st[s.status]||0)+1});
  L.push('\n== TRẠNG THÁI ==\n'+Object.keys(st).map(function(k){return k+' x'+st[k]}).join(' | '));
  var re=/402|404/;
  L.push('\n== PHÒNG KHỚP 402/404 ==');
  ED.rooms.filter(function(r){return re.test(JSON.stringify(r))}).slice(0,6).forEach(function(r){L.push(sh(r))});
  L.push('\n== SLOT KHỚP 402/404 ==');
  ED.slots.filter(function(s){return re.test(JSON.stringify(s))}).slice(0,8).forEach(function(s){L.push(sh(s))});
  t.value=L.join('\n');t.focus();t.select();
};

load();
})();
</script>
</body>
</html>
