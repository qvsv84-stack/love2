<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Love Story · Nhật ký cặp đôi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ================= CSS TOÀN CỤC ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Quicksand', sans-serif; background: linear-gradient(145deg, #fff0f5 0%, #ffe4ec 100%); min-height: 100vh; color: #5a3e4b; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    :root {
      --primary: #fbc4d0; --text-main: #5f2e42;
      --bg-glass: rgba(255, 240, 245, 0.95);
    }

    /* ================= ĐĂNG NHẬP ================= */
    .login-screen { position: fixed; inset: 0; background: #fff0f5; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; transition: opacity 0.4s ease, visibility 0.4s; }
    .login-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    .login-box { background: #fffbfd; max-width: 400px; width: 100%; padding: 40px 30px; border-radius: 40px; box-shadow: 0 20px 40px -15px #e5a5b9; text-align: center; border: 1px solid #f8c8d8; }
    .login-box h2 { font-family: 'Dancing Script', cursive; font-size: 3rem; color: #b15170; margin-bottom: 10px; }
    .input-group { position: relative; margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 16px 20px; border-radius: 30px; border: 2px solid #f8c8d8; background: #fff; font-size: 1.1rem; font-family: inherit; color: #5a3e4b; outline: none; }
    .input-group input:focus { border-color: #fbc4d0; }
    .btn-primary { background: var(--primary); border: none; width: 100%; padding: 16px; border-radius: 30px; font-size: 1.2rem; font-weight: 700; color: #5a2c3e; cursor: pointer; box-shadow: 0 10px 20px -8px #e5a5b9; transition: 0.2s; border: 2px solid #fff; margin-top: 10px; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error { color: #c0392b; font-size: 0.9rem; margin-top: 15px; min-height: 20px; font-weight: 500; }

    /* ================= APP SHELL ================= */
    .app-screen { max-width: 500px; width: 100%; height: 100vh; max-height: 932px; /* iPhone 14 Pro Max height */ background: var(--bg-glass); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    @media (min-width: 500px) { .app-screen { border-radius: 40px; height: 90vh; box-shadow: 0 25px 50px -15px rgba(230, 120, 150, 0.4); } }
    .app-screen.hidden { display: none; }
    
    /* Header */
    .app-header { padding: 20px 20px 15px; display: flex; justify-content: space-between; align-items: center; background: transparent; flex-shrink: 0; }
    .app-header h1 { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: #c96b8b; line-height: 1; }
    .user-info { font-weight: 600; color: #b15170; background: #fff; padding: 6px 12px; border-radius: 20px; box-shadow: 0 4px 10px #f3cedb; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }

    /* Main Content Area */
    .app-content { flex: 1; overflow-y: auto; padding: 0 15px 80px; position: relative; display: flex; flex-direction: column; }
    .view-section { display: none; flex: 1; flex-direction: column; animation: fadeIn 0.3s ease; }
    .view-section.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ================= NHẬT KÝ TABS ================= */
    .diary-tabs-container { background: #fff; border-radius: 20px; padding: 5px; display: flex; gap: 5px; margin-bottom: 15px; box-shadow: 0 5px 15px -5px #e5bccb; flex-shrink: 0; }
    .dtab { flex: 1; text-align: center; padding: 12px 5px; font-size: 0.85rem; font-weight: 700; color: #b38392; border-radius: 15px; cursor: pointer; transition: 0.2s; }
    .dtab.active { background: #fbc4d0; color: #5a2c3e; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* Ngày tháng */
    .date-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
    .date-picker-wrapper { display: flex; align-items: center; gap: 8px; background: #fff; padding: 6px 12px; border-radius: 15px; box-shadow: 0 3px 10px -3px #e5bccb; }
    .date-picker-wrapper input[type="date"] { border: none; font-family: inherit; color: #5a3e4b; font-weight: 700; font-size: 1rem; outline: none; background: transparent; }
    
    /* Vùng nội dung tab */
    .diary-tab-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Trang giấy kẻ dòng */
    .lined-textarea, .lined-paper {
      width: 100%;
      background-color: #fffbfd;
      background-image: repeating-linear-gradient(
        transparent, transparent 31px, #fce4ec 31px, #fce4ec 32px
      );
      background-attachment: local;
      line-height: 32px;
      padding: 8px 15px;
      border: 1px solid #f8c8d8;
      border-radius: 15px;
      font-family: inherit;
      font-size: 1rem;
      color: #4b2e39;
      outline: none;
    }
    
    .lined-textarea { flex: 1; resize: none; min-height: 350px; }
    .lined-textarea:focus { border-color: #fbc4d0; box-shadow: 0 0 0 3px #fff0f5; }
    .lined-paper { flex: 1; overflow-y: auto; white-space: pre-wrap; min-height: 350px; }
    
    .empty-state { text-align: center; color: #b38392; font-style: italic; padding: 40px 20px; line-height: 1.6; }

    /* Nút hành động (Sửa/Xóa/Lưu) */
    .action-buttons { display: flex; gap: 10px; margin-top: 15px; flex-shrink: 0; }
    .btn-action { flex: 1; padding: 14px; border-radius: 15px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-save { background: #fbc4d0; color: #5a2c3e; box-shadow: 0 4px 10px rgba(200,100,130,0.2); }
    .btn-save:hover { background: #ffdae5; }
    .btn-edit { background: #fff; color: #b15170; border: 2px solid #fbc4d0; }
    .btn-delete { background: #fff0f0; color: #c0392b; border: 2px solid #ffcccc; }
    
    /* Tab Cặp đôi (2 cột) */
    .couple-grid { display: flex; gap: 15px; flex: 1; overflow: hidden; }
    .couple-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .couple-col-header { font-weight: 700; font-size: 1rem; color: #b15170; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
    .couple-col:nth-child(2) .couple-col-header { color: #4a7ab5; }
    .couple-col .lined-paper { font-size: 0.95rem; }

    /* ================= BOTTOM NAVIGATION ================= */
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 12px 10px 20px; border-top: 1px solid #f8c8d8; border-radius: 20px 20px 0 0; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #b38392; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .nav-item i { font-size: 1.4rem; }
    .nav-item.active { color: #b15170; }

    /* ================= SETTINGS ================= */
    .settings-modal { position: absolute; inset: 0; background: rgba(255,255,255,0.95); z-index: 500; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px; }
    .settings-modal.open { opacity: 1; pointer-events: all; }
    .settings-box { background: #fff; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(200,100,130,0.2); }
    .btn-logout { background: #ffe2eb; color: #c0392b; border: 1px solid #f8c8d8; padding: 12px 20px; border-radius: 15px; cursor: pointer; font-weight: 700; margin-top: 20px; width: 100%; }
    .settings-btn { background: transparent; border: none; color: #b38392; font-size: 1.3rem; cursor: pointer; }
  </style>
</head>
<body>

  <!-- MÀN HÌNH ĐĂNG NHẬP -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h2>Love Story</h2>
      <p style="color: #b38392; margin-bottom: 20px;">Nhập tên và mật khẩu để vào nhà 💕</p>
      <div class="input-group">
        <input type="text" id="usernameInput" placeholder="Tên (vd: diemmy)" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Mật khẩu">
      </div>
      <button class="btn-primary" id="loginBtn">Đăng nhập</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- APP CHÍNH -->
  <div class="app-screen hidden" id="appScreen">
    <!-- Header -->
    <div class="app-header">
      <h1>Love Story</h1>
      <div class="user-info">
        <span id="displayUser">—</span>
        <button class="settings-btn" id="openSettingsBtn"><i class="fas fa-cog"></i></button>
      </div>
    </div>
    
    <!-- Vùng nội dung chính -->
    <div class="app-content">
      
      <!-- TAB NHẬT KÝ -->
      <div class="view-section active" id="view-diary">
        
        <!-- Tabs con -->
        <div class="diary-tabs-container">
          <div class="dtab active" data-dtab="self">Nhật ký bản thân</div>
          <div class="dtab" data-dtab="partner">Nhật ký người ấy</div>
          <div class="dtab" data-dtab="couple">Nhật ký cặp đôi</div>
        </div>

        <!-- Chọn ngày -->
        <div class="date-header">
          <div class="date-picker-wrapper">
            <i class="fas fa-calendar-day" style="color:#b15170;"></i>
            <input type="date" id="diaryDate">
          </div>
        </div>

        <!-- Nội dung Tab -->
        <div class="diary-tab-content" id="diaryTabContent">
          <!-- Render bằng JS -->
        </div>
      </div>

      <!-- TAB KHÁC (Giữ nguyên placeholder) -->
      <div class="view-section" id="view-photos">
        <h2 style="font-family: 'Dancing Script'; font-size: 2rem; color: #b15170; margin-bottom: 15px;">Kỷ niệm ảnh</h2>
        <p style="text-align: center; color: #b38392;">Tính năng đang phát triển...</p>
      </div>
      <div class="view-section" id="view-promise">
        <h2 style="font-family: 'Dancing Script'; font-size: 2rem; color: #b15170; margin-bottom: 15px;">Giao ước</h2>
        <p style="text-align: center; color: #b38392;">Tính năng đang phát triển...</p>
      </div>
      
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" data-target="view-diary"><i class="fas fa-book"></i> Nhật ký</div>
      <div class="nav-item" data-target="view-photos"><i class="fas fa-images"></i> Ảnh</div>
      <div class="nav-item" data-target="view-promise"><i class="fas fa-handshake"></i> Giao ước</div>
    </div>

    <!-- Modal Settings -->
    <div class="settings-modal" id="settingsModal">
      <div class="settings-box">
        <h3 style="font-family: 'Dancing Script'; font-size: 1.8rem; color: #b15170; margin-bottom: 15px; text-align: center;">Cài đặt</h3>
        <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
        <button class="btn-primary" id="closeSettingsBtn" style="background: #e0c3d0; color: #5a3e4b; margin-top: 10px; padding: 12px;">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    // ====== CẤU HÌNH SUPABASE ======
    const SUPABASE_URL = 'https://cjswxglxyyqrcfbyyjer.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jgRKlQFfL09zN_uU3P6SnQ_F_1UAJx9';
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elements
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const displayUser = document.getElementById('displayUser');
    const dateInput = document.getElementById('diaryDate');
    const diaryTabContent = document.getElementById('diaryTabContent');
    
    // State
    let currentUser = '';
    let partnerUser = '';
    let currentDiaryTab = 'self'; // 'self', 'partner', 'couple'
    let currentEntryId = null; // ID của bản ghi đang xem (nếu có)

    function getTodayString() {
      const today = new Date();
      const vnTime = new Date(today.getTime() + (7 * 60 * 60 * 1000));
      return vnTime.toISOString().split('T')[0];
    }

    // ====== AUTH ======
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user.email.split('@')[0];
        enterApp();
      }
    }

    function enterApp() {
      partnerUser = currentUser === 'diemmy' ? 'tienloi' : 'diemmy';
      displayUser.innerHTML = `<i class="fas fa-user-heart"></i> ${currentUser.charAt(0).toUpperCase() + currentUser.slice(1)}`;
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      dateInput.value = getTodayString();
      renderDiaryTab();
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;
      const loginError = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');
      
      loginError.textContent = '';
      if (!username || !password) { loginError.textContent = 'Nhập đủ tên và mật khẩu!'; return; }
      if (username !== 'diemmy' && username !== 'tienloi') { loginError.textContent = 'Tên không hợp lệ!'; return; }

      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      loginBtn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({ email: `${username}@daomeo.local`, password });
        if (error) throw error;
        currentUser = username;
        enterApp();
      } catch (err) {
        loginError.textContent = err.message.includes('Invalid') ? 'Sai tên hoặc mật khẩu!' : err.message;
      } finally {
        loginBtn.innerHTML = 'Đăng nhập';
        loginBtn.disabled = false;
      }
    });

    document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
    document.getElementById('logoutBtn').addEventListener('click', async () => { await supabaseClient.auth.signOut(); location.reload(); });
    document.getElementById('openSettingsBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.add('open'));
    document.getElementById('closeSettingsBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.remove('open'));

    // Chuyển tab chính (Nhật ký, Ảnh, Giao ước)
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(item.getAttribute('data-target')).classList.add('active');
      });
    });

    // Chuyển tab con (Self, Partner, Couple)
    document.querySelectorAll('.dtab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.dtab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentDiaryTab = tab.getAttribute('data-dtab');
        renderDiaryTab();
      });
    });

    dateInput.addEventListener('change', renderDiaryTab);

    // ====== LOGIC RENDER NHẬT KÝ ======
    async function renderDiaryTab() {
      const selectedDate = dateInput.value;
      if (!selectedDate) return;

      // Hiển thị trạng thái đang tải
      diaryTabContent.innerHTML = '<div style="text-align:center; padding: 40px; color:#b38392;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

      // Lấy mốc thời gian đầu ngày và cuối ngày (giờ VN)
      const startOfDay = new Date(`${selectedDate}T00:00:00+07:00`).toISOString();
      const endOfDay = new Date(`${selectedDate}T23:59:59.999+07:00`).toISOString();

      try {
        if (currentDiaryTab === 'self') {
          await renderSelfTab(startOfDay, endOfDay);
        } else if (currentDiaryTab === 'partner') {
          await renderPartnerTab(startOfDay, endOfDay);
        } else if (currentDiaryTab === 'couple') {
          await renderCoupleTab(startOfDay, endOfDay);
        }
      } catch (err) {
        diaryTabContent.innerHTML = `<div style="color:#c0392b; text-align:center; padding:20px;">Lỗi tải dữ liệu: ${err.message}</div>`;
      }
    }

    // Hàm lấy dữ liệu 1 người trong 1 ngày
    async function fetchEntry(author, startOfDay, endOfDay) {
      const { data, error } = await supabaseClient
        .from('diary_entries')
        .select('*')
        .eq('author', author)
        .gte('created_at', startOfDay)
        .lte('created_at', endOfDay)
        .limit(1)
        .maybeSingle();
      if (error) throw error;
      return data;
    }

    // 1. TAB BẢN THÂN
    async function renderSelfTab(startOfDay, endOfDay) {
      const entry = await fetchEntry(currentUser, startOfDay, endOfDay);
      currentEntryId = entry ? entry.id : null;

      let html = '';
      if (entry) {
        // Đã có dữ liệu -> hiển thị để sửa/xóa
        html = `
          <textarea class="lined-textarea" id="selfTextarea" placeholder="Viết gì đó...">${escapeHtml(entry.content)}</textarea>
          <div class="action-buttons">
            <button class="btn-action btn-save" id="btnSaveSelf"><i class="fas fa-save"></i> Lưu thay đổi</button>
            <button class="btn-action btn-delete" id="btnDeleteSelf"><i class="fas fa-trash"></i> Xóa</button>
          </div>
        `;
      } else {
        // Chưa có -> hiển thị ô trống để viết
        html = `
          <textarea class="lined-textarea" id="selfTextarea" placeholder="Hôm nay bạn muốn viết gì?"></textarea>
          <div class="action-buttons">
            <button class="btn-action btn-save" id="btnSaveSelf"><i class="fas fa-plus"></i> Lưu nhật ký</button>
          </div>
        `;
      }
      diaryTabContent.innerHTML = html;

      // Gắn sự kiện
      document.getElementById('btnSaveSelf').addEventListener('click', saveSelfDiary);
      const delBtn = document.getElementById('btnDeleteSelf');
      if (delBtn) delBtn.addEventListener('click', deleteSelfDiary);
    }

    async function saveSelfDiary() {
      const content = document.getElementById('selfTextarea').value.trim();
      if (!content) return alert('Chưa viết gì mà!');

      const btn = document.getElementById('btnSaveSelf');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';
      btn.disabled = true;

      try {
        if (currentEntryId) {
          // Cập nhật
          const { error } = await supabaseClient.from('diary_entries').update({ content }).eq('id', currentEntryId);
          if (error) throw error;
          alert('Đã cập nhật nhật ký!');
        } else {
          // Thêm mới
          const { error } = await supabaseClient.from('diary_entries').insert([{ content, author: currentUser }]);
          if (error) throw error;
          alert('Đã lưu nhật ký mới!');
        }
        renderDiaryTab();
      } catch (err) {
        alert('Lỗi khi lưu: ' + err.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function deleteSelfDiary() {
      if (!confirm('Bạn có chắc muốn xóa nhật ký ngày này không?')) return;
      
      try {
        const { error } = await supabaseClient.from('diary_entries').delete().eq('id', currentEntryId);
        if (error) throw error;
        alert('Đã xóa!');
        renderDiaryTab();
      } catch (err) {
        alert('Lỗi khi xóa: ' + err.message);
      }
    }

    // 2. TAB NGƯỜI ẤY
    async function renderPartnerTab(startOfDay, endOfDay) {
      const entry = await fetchEntry(partnerUser, startOfDay, endOfDay);
      
      if (!entry) {
        diaryTabContent.innerHTML = `<div class="empty-state"><i class="fas fa-heart-broken fa-2x" style="color:#f8c8d8; margin-bottom:15px;"></i><br>Người ấy chưa viết gì vào ngày này...</div>`;
        return;
      }

      diaryTabContent.innerHTML = `
        <div class="lined-paper">${escapeHtml(entry.content)}</div>
      `;
    }

    // 3. TAB CẶP ĐÔI
    async function renderCoupleTab(startOfDay, endOfDay) {
      const [entrySelf, entryPartner] = await Promise.all([
        fetchEntry(currentUser, startOfDay, endOfDay),
        fetchEntry(partnerUser, startOfDay, endOfDay)
      ]);

      const htmlSelf = entrySelf ? `<div class="lined-paper">${escapeHtml(entrySelf.content)}</div>` : `<div class="lined-paper empty-state" style="font-size:0.9rem;">Chưa viết gì...</div>`;
      const htmlPartner = entryPartner ? `<div class="lined-paper">${escapeHtml(entryPartner.content)}</div>` : `<div class="lined-paper empty-state" style="font-size:0.9rem;">Chưa viết gì...</div>`;

      diaryTabContent.innerHTML = `
        <div class="couple-grid">
          <div class="couple-col">
            <div class="couple-col-header"><i class="fas fa-heart" style="color:#f48fb1;"></i> ${currentUser.charAt(0).toUpperCase() + currentUser.slice(1)}</div>
            ${htmlSelf}
          </div>
          <div class="couple-col">
            <div class="couple-col-header"><i class="fas fa-heart" style="color:#64b5f6;"></i> ${partnerUser.charAt(0).toUpperCase() + partnerUser.slice(1)}</div>
            ${htmlPartner}
          </div>
        </div>
      `;
    }

    // Hàm chống XSS
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Khởi chạy
    checkSession();
  </script>
